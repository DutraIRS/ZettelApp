name: Release

# Push a tag such as v1.0.0 to build the installer and portable zip and publish a GitHub release.
# The website's download buttons point at /releases/latest/download/<file>, so they update automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Official releases must be signed unless an unsigned release is explicitly approved.
      SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      ZETTELAPP_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = python -c "import zettelapp; print(zettelapp.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      # One command per step: in PowerShell a multi-line step only fails when its last
      # command fails, which would let failing tests through.
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-report=term-missing
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Require signing or explicit unsigned approval
        if: env.SIGN_CERT == '' && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        shell: pwsh
        run: throw "Signing certificate is absent. Set ALLOW_UNSIGNED_RELEASE=true only for an explicitly approved unsigned release."
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare signing certificate
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          "ZETTELAPP_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Verify Authenticode signatures
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          foreach ($path in @("dist/ZettelApp/ZettelApp.exe", "dist/ZettelApp/zettelapp-mcp.exe", "dist/ZettelApp-Setup.exe")) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") { throw "$path signature is $($signature.Status)" }
          }
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/ZettelApp-Setup.exe dist/ZettelApp-Portable.zip dist/SHA256SUMS.txt `
            --title "ZettelApp ${{ github.ref_name }}" --generate-notes
