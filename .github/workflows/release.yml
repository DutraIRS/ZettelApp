name: Release

# Push a tag such as v1.1.0 to build the installers and portable archives and publish a GitHub
# release. The website's download buttons point at /releases/latest/download/<file>, so they
# update automatically. Linux packages are built first (job `linux`) and attached to the same
# release; the Snap and the Flatpak bundle are built afterwards and attached too, and the Snap
# is published to the Snap Store when credentials exist. The Microsoft Store package (.msix,
# unsigned: the Store signs it) is kept as the workflow artifact `microsoft-store-package`, to
# upload to Partner Center.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: everything is built and kept
# as workflow artifacts, nothing is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check that the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version="$(python -c 'import zettelapp; print(zettelapp.__version__)')"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version $version"
            exit 1
          fi
      # Qt's system libraries, for the packaged app's self-test (runner images lack libEGL).
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build the portable tar.gz and the .deb
        run: bash packaging/build-linux.sh
      - name: Upload the Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/ZettelApp-Linux-x86_64.tar.gz
            dist/ZettelApp-Linux-amd64.deb
            dist/SHA256SUMS-linux.txt
          retention-days: 7

  release:
    runs-on: windows-latest
    needs: [linux]
    env:
      # Official releases must be signed unless an unsigned release is explicitly approved.
      SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      ZETTELAPP_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check that the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = python -c "import zettelapp; print(zettelapp.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      # One command per step: in PowerShell a multi-line step only fails when its last
      # command fails, which would let failing tests through.
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -X faulthandler -m pytest -q --cov --cov-report=term-missing
          Write-Host "pytest exit code: $LASTEXITCODE"
          exit $LASTEXITCODE
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Require signing or explicit unsigned approval
        if: env.SIGN_CERT == '' && vars.ALLOW_UNSIGNED_RELEASE != 'true'
        shell: pwsh
        run: throw "Signing certificate is absent. Set ALLOW_UNSIGNED_RELEASE=true only for an explicitly approved unsigned release."
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare signing certificate
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          "ZETTELAPP_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Verify Authenticode signatures
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          foreach ($path in @("dist/ZettelApp/ZettelApp.exe", "dist/ZettelApp/zettelapp-mcp.exe", "dist/ZettelApp-Setup.exe")) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") { throw "$path signature is $($signature.Status)" }
          }
      - name: Download the Linux packages
        uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: dist
      - name: Merge checksums
        shell: pwsh
        run: |
          Get-Content dist/SHA256SUMS-linux.txt | Add-Content dist/SHA256SUMS.txt
          Remove-Item dist/SHA256SUMS-linux.txt
      - name: Keep the Microsoft Store package
        uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-package
          path: dist/ZettelApp.msix
          if-no-files-found: error
          retention-days: 90
      - name: Keep the Windows downloads (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-downloads
          path: |
            dist/ZettelApp-Setup.exe
            dist/ZettelApp-Portable.zip
            dist/SHA256SUMS.txt
          retention-days: 7
      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("dist/ZettelApp-Setup.exe", "dist/ZettelApp-Portable.zip", "dist/SHA256SUMS.txt",
            "dist/ZettelApp-Linux-amd64.deb", "dist/ZettelApp-Linux-x86_64.tar.gz")
          gh release create "${{ github.ref_name }}" $files `
            --title "ZettelApp ${{ github.ref_name }}" --generate-notes

  flatpak:
    runs-on: ubuntu-24.04
    needs: [linux]
    # The image has flatpak-builder and the KDE 6.11 runtime and SDK; the PySide base app is
    # installed from Flathub first (updating the image's runtime fails in the container). The build itself runs offline, as on Flathub.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build the Flatpak bundle
        run: |
          flatpak install -y --noninteractive flathub io.qt.PySide.BaseApp//6.11
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=build/repo build/app             packaging/flatpak/io.github.dutrairs.zettelapp.yml
          mkdir -p dist
          # --runtime-repo: installing the bundle fetches the runtime from Flathub.
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo             build/repo dist/ZettelApp-Linux-x86_64.flatpak io.github.dutrairs.zettelapp
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: dist/ZettelApp-Linux-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7

  snap:
    runs-on: ubuntu-24.04
    needs: [release, flatpak]
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v7
      # snapcraft looks for snap/snapcraft.yaml in the project's root.
      - name: Put the Snap recipe where snapcraft looks
        run: cp -r packaging/snap snap
      - name: Build the Snap
        id: build
        uses: snapcore/action-build@v1
      - name: Name the Snap
        run: mv "${{ steps.build.outputs.snap }}" ZettelApp-Linux-amd64.snap
      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ZettelApp-Linux-amd64.snap
          retention-days: 7
      - uses: actions/download-artifact@v7
        with:
          name: flatpak-bundle
      - name: Attach the Snap and the Flatpak bundle to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" ZettelApp-Linux-amd64.snap             ZettelApp-Linux-x86_64.flatpak --clobber
      - name: Publish to the Snap Store
        if: github.event_name == 'push' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: snapcraft upload --release=stable ZettelApp-Linux-amd64.snap
