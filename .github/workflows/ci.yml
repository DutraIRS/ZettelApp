name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Check generated website is up to date
        run: |
          python -m pip install "markdown-it-py==4.2.0"
          python tools/build_site.py
          git diff --exit-code -- website/docs || {
            echo "::error::website/docs is stale. Regenerate with: python tools/build_site.py"
            exit 1
          }

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-report=term-missing

  build:
    needs: [quality, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and self-test the packaged app
        shell: pwsh
        run: ./packaging/build.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: ZettelApp-Portable
          path: dist/ZettelApp-Portable.zip
          retention-days: 7
