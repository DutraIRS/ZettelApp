name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # One command per step: in PowerShell (the default shell on Windows runners) a
      # multi-line step only fails when its last command fails.
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Check generated website is up to date
        shell: bash
        run: |
          python tools/build_site.py
          git diff --exit-code -- website || {
            echo "::error::The generated website is stale. Regenerate with: python tools/build_site.py"
            exit 1
          }

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          # The Linux build and release use 3.13: the pinned wheels are verified there.
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-report=term-missing

  build:
    needs: [quality, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and self-test the packaged app
        shell: pwsh
        run: ./packaging/build.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v7
        with:
          name: ZettelApp-Portable
          path: dist/ZettelApp-Portable.zip
          retention-days: 7

  build-linux:
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the Linux packaging metadata
        run: |
          bash -n packaging/build-linux.sh
          desktop-file-validate packaging/io.github.dutairs.zettelapp.desktop
          appstreamcli validate --pedantic packaging/io.github.dutairs.zettelapp.metainfo.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          import yaml

          for path in (
              "packaging/flatpak/io.github.dutairs.zettelapp.yml",
              "packaging/snap/snapcraft.yaml",
          ):
              yaml.safe_load(open(path, encoding="utf-8"))
          ET.parse("packaging/io.github.dutairs.zettelapp.metainfo.xml")
          print("packaging metadata OK")
          PY
      - name: Build and self-test the packaged app
        run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ZettelApp-Portable-Linux
          path: dist/ZettelApp-*-linux-x86_64.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ZettelApp-deb
          path: dist/zettelapp_*_amd64.deb
          retention-days: 7
