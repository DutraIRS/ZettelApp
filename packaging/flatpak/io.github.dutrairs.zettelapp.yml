app-id: io.github.dutrairs.zettelapp
# PySide6 comes from Flathub's PySide base app (on the KDE runtime); every other Python
# package is a checksummed source in python3-deps.yaml, so the build needs no network
# (as Flathub requires). Regenerate that file when requirements.txt changes:
#   flatpak-pip-generator --runtime=org.kde.Sdk//6.11 --requirements-file=<requirements.txt
#     without PySide6> --prefer-wheels=numpy,onnxruntime,tokenizers,rapidfuzz,pydantic-core,
#     jiter,pyyaml,hf-xet,protobuf,markupsafe --yaml --output python3-deps
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: zettelapp
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.portal.Desktop
cleanup-commands:
  - /app/cleanup-BaseApp.sh
# The release workflow builds a bundle from it (job `flatpak`). Build locally, from a clean
# checkout (the whole folder is copied in), with:
#   flatpak-builder --force-clean --install-deps-from=flathub --install --user build/flatpak packaging/flatpak/io.github.dutrairs.zettelapp.yml
# Flathub's copy of this manifest takes its source from the release tag instead of the folder.
modules:
  - python3-deps.yaml
  - name: zettelapp
    buildsystem: simple
    build-commands:
      # Dependencies are already installed (python3-deps.yaml and the base app's PySide6).
      - pip3 install --verbose --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/io.github.dutrairs.zettelapp.desktop
        /app/share/applications/io.github.dutrairs.zettelapp.desktop
      - install -Dm644 packaging/io.github.dutrairs.zettelapp.metainfo.xml
        /app/share/metainfo/io.github.dutrairs.zettelapp.metainfo.xml
      - install -Dm644 zettelapp/resources/icon-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.dutrairs.zettelapp.png
      - install -Dm644 zettelapp/resources/icon.svg
        /app/share/icons/hicolor/scalable/apps/io.github.dutrairs.zettelapp.svg
    sources:
      - type: dir
        path: ../..
